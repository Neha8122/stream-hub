global:
  scrape_interval: 5s          # short so the demo reacts quickly; 15-30 s is usual
  evaluation_interval: 5s

rule_files:
  - slo-rules.yml

scrape_configs:
  - job_name: stream-hub
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8180   # gateway
          - host.docker.internal:8181   # catalog
          - host.docker.internal:8182   # user
          - host.docker.internal:8183   # playback
          - host.docker.internal:8184   # history
          - host.docker.internal:8185   # home
