server:
  port: 8183

spring:
  application:
    name: playback-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    # Trace context travels in Kafka headers: publish and consume join one trace.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all                       # written to every in-sync replica before it counts
      properties:
        enable.idempotence: true      # a producer retry can't write the event twice
        spring.json.add.type.headers: false

playback:
  session-ttl: 2m                     # a player that stops sending heartbeats is gone after this
  max-watched-per-event: 60s          # a heartbeat can't claim more watching than this

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  # --- observability (docs/lld-observability.html) ---
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}   # every request in dev; a few % in production
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s   # 300 ms is the home page SLO threshold
