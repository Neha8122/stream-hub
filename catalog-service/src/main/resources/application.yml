server:
  port: 8181     # stream-hub services use 818x

spring:
  application:
    name: catalog-service
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${DB_USER:streamhub}
    password: ${DB_PASSWORD:streamhub}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Fail fast: if Redis is slow or down we'd rather read Postgres than wait.
      timeout: 200ms
      connect-timeout: 500ms

catalog:
  cache:
    fresh-for: 5m          # after this an entry is stale: served, but one request refreshes it
    keep-for: 1h           # Redis TTL: how long a stale copy stays usable
    missing-for: 30s       # how long "this id doesn't exist" is remembered
  search:
    embed-timeout: 150ms           # past this, search answers with keyword results only
    max-concurrent-embeddings: 8   # model calls in flight; more searches than this skip the meaning half
    index-every: 5s                # how often new or edited titles are embedded

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  # --- observability (docs/lld-observability.html) ---
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}   # every request in dev; a few % in production
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s   # 300 ms is the home page SLO threshold
