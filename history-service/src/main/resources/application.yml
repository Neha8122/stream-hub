server:
  port: 8184

spring:
  application:
    name: history-service
  datasource:
    url: ${HISTORY_DB_URL:jdbc:postgresql://localhost:5432/history}
    username: ${DB_USER:streamhub}
    password: ${DB_PASSWORD:streamhub}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: history
      auto-offset-reset: earliest
      enable-auto-commit: false       # Spring commits after the listener returns
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # A message that isn't valid JSON must not crash the consumer in a loop:
      # the wrapper turns it into an error the error handler sends to the DLT.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.streamhub.events.PlaybackEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.streamhub.events

history:
  finished-at: 0.95                   # past this share of the runtime a title counts as watched

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
