server:
  port: 8185

spring:
  application:
    name: home-service
  threads:
    virtual:
      enabled: true               # request threads are cheap; bulkheads still cap what we send out

home:
  deadline: 300ms                 # the whole page, however many rows
  history:
    url: ${HISTORY_URL:http://localhost:8184}
    timeout: 150ms
    max-concurrent: 20
  catalog:
    url: ${CATALOG_URL:http://localhost:8181}
    timeout: 200ms
    max-concurrent: 30
  recs:
    url: ${RECS_URL:http://localhost:8186}
    timeout: 200ms                # recs calls catalog itself, so a bit more room
    max-concurrent: 20
  breaker:
    open-for: 5s                  # how long to leave a failing dependency alone
  genres: drama,sci-fi,comedy     # one row each
  shared-rows-fresh-for: 30s      # genre rows are the same for everyone: reuse a copy this fresh

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  # --- observability (docs/lld-observability.html) ---
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}   # every request in dev; a few % in production
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s   # 300 ms is the home page SLO threshold
