server:
  port: 8182

spring:
  application:
    name: user-service
  datasource:
    url: ${USERS_DB_URL:jdbc:postgresql://localhost:5432/users}
    username: ${DB_USER:streamhub}
    password: ${DB_PASSWORD:streamhub}

auth:
  # Shared with the gateway, which checks every token. Override in any real deployment.
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes}
  token-lifetime: 1h

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  # --- observability (docs/lld-observability.html) ---
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}   # every request in dev; a few % in production
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s   # 300 ms is the home page SLO threshold
