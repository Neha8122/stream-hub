server:
  port: 8180

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

auth:
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes}

routes:
  catalog: ${CATALOG_URL:http://localhost:8181}
  users: ${USERS_URL:http://localhost:8182}
  playback: ${PLAYBACK_URL:http://localhost:8183}
  history: ${HISTORY_URL:http://localhost:8184}
  home: ${HOME_URL:http://localhost:8185}
  timeout-ms: 2000          # a backend slower than this gets a 504, not a hung client

limits:
  per-user-per-second: 50   # steady rate; bursts up to 2x
  login-per-ip-per-second: 5

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  # --- observability (docs/lld-observability.html) ---
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}   # every request in dev; a few % in production
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s   # 300 ms is the home page SLO threshold
