server:
  port: 8186

spring:
  application:
    name: recs-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      group-id: recs                  # its own group: gets every event, independent of history
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.streamhub.events.PlaybackEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.streamhub.events

recs:
  half-life: 3d                       # a minute watched 3 days ago counts half as much as one now
  cache-for: 30s                      # a computed row is reused this long, unless the taste changes first
  catalog:
    url: ${CATALOG_URL:http://localhost:8181}
    timeout: 300ms

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  # --- observability (docs/lld-observability.html) ---
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s
